name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:all
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
